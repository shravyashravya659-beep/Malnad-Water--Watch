```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Malnad WaterWatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #103b46, #16866b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px #0003;
        }
        h2 { color: #103b46; }
        .btn-login {
            background: #16866b;
            color: white;
            width: 100%;
        }
        .btn-login:hover { background: #0d6e58; color: white; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="text-center">💧 Malnad WaterWatch</h2>
        <p class="text-center text-secondary">Welcome back!</p>

        <form id="loginForm">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control mb-3"
                   placeholder="Enter your email" required>

            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control mb-3"
                   placeholder="Enter your password" required>

            <button type="submit" class="btn btn-login py-2">Login</button>
            <p id="message" class="text-center mt-3"></p>
        </form>

        <p class="text-center mt-3">
            New user? <a href="register.html">Register here</a>
        </p>
        <p class="text-center"><a href="index.html">← Back to Home</a></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Demo only: Login needs a backend to verify your account.";
        });
    </script>
</body>
</html>
