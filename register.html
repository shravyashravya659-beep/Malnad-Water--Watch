```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Malnad WaterWatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #103b46, #16866b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .register-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px #0003;
        }
        h2 { color: #103b46; }
        .btn-register {
            background: #16866b;
            color: white;
            width: 100%;
        }
        .btn-register:hover {
            background: #0d6e58;
            color: white;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2 class="text-center">💧 Create Account</h2>
        <p class="text-center text-secondary">Join Malnad WaterWatch</p>

        <form id="registerForm">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control mb-3"
                   placeholder="Enter your name" required>

            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control mb-3"
                   placeholder="Enter your email" required>

            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control mb-3"
                   placeholder="Create a password" minlength="8" required>

            <button type="submit" class="btn btn-register py-2">
                Register
            </button>

            <p id="message" class="text-center mt-3"></p>
        </form>

        <p class="text-center mt-3">
            Already registered? <a href="login.html">Login</a>
        </p>
        <p class="text-center">
            <a href="index.html">← Back to Home</a>
        </p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Demo only: Connect a backend to create your account.";
        });
    </script>
</body>
</html>
```
